<!DOCTYPE html>
<!--
  Панель AutoCut для Premiere Pro.

  Это интерфейс, а не мозг: тяжёлое (распознавание, описание кадров,
  подбор) делает движок AutoCut, панель спрашивает его по HTTP и
  показывает ход работы. Собранная рыба импортируется в проект
  прямо отсюда — человеку не нужно ничего кликать в Premiere.
-->
<html>
<head>
  <meta charset="utf-8">
  <title>AutoCut</title>
  <style>
    body {
      font-family: "Adobe Clean", "Segoe UI", sans-serif;
      background: #232323; color: #d6d6d6; margin: 0; padding: 10px;
      font-size: 12px;
    }
    h1 { font-size: 13px; margin: 0 0 8px; font-weight: 600; }
    .row { display: flex; align-items: center; gap: 6px; margin-bottom: 7px; }
    .row label { min-width: 78px; color: #9a9a9a; }
    input[type=text] {
      flex: 1; background: #1b1b1b; border: 1px solid #4a4a4a; color: #e6e6e6;
      border-radius: 3px; padding: 4px 6px; font-size: 12px;
    }
    input[type=number] {
      width: 58px; background: #1b1b1b; border: 1px solid #4a4a4a;
      color: #e6e6e6; border-radius: 3px; padding: 4px 6px; font-size: 12px;
    }
    button {
      background: #3a3a3a; color: #e6e6e6; border: 1px solid #555;
      border-radius: 3px; padding: 5px 9px; cursor: pointer; font-size: 12px;
    }
    button:hover { background: #4a4a4a; }
    button.main { background: #2d5f8a; border-color: #3a76a8; }
    button.main:hover { background: #35709f; }
    button:disabled { opacity: .45; cursor: default; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #7a7a7a; }
    .dot.on { background: #3ba55d; }
    .dot.off { background: #d24b4b; }
    #log {
      background: #1b1b1b; border: 1px solid #3a3a3a; border-radius: 3px;
      height: 260px; overflow-y: auto; padding: 7px; margin-top: 8px;
      font-family: Consolas, monospace; font-size: 11px; white-space: pre-wrap;
    }
    .ok { color: #7fc98a; } .err { color: #e07a7a; } .dim { color: #8a8a8a; }
    .hint { color: #8a8a8a; margin: 4px 0 8px; }
  </style>
</head>
<body>
  <h1>AutoCut</h1>

  <div class="row">
    <label>Материал</label>
    <input type="text" id="folder" placeholder="папка с исходниками" />
    <button id="btn-find">Найти</button>
  </div>

  <div class="row">
    <label>Хронометраж</label>
    <input type="number" id="target" value="120" />
    <span class="dim">сек</span>
    <button id="btn-digest" class="main">Собрать дайджест</button>
    <button id="btn-cancel">Отменить</button>
  </div>

  <div class="row">
    <span class="dot" id="dot"></span>
    <span id="state">проверяю движок…</span>
  </div>

  <div class="row">
    <button id="btn-check">Что в проекте</button>
    <button id="btn-doctor">Проверить движок</button>
    <button id="btn-refresh">Обновить</button>
  </div>

  <div class="hint" id="parts"></div>
  <div id="log"></div>

  <script src="panel.js"></script>
</body>
</html>
