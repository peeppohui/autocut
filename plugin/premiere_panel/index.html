<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AutoCut</title>
  <style>
    body {
      font-family: "Adobe Clean", "Segoe UI", sans-serif;
      background: #232323; color: #d6d6d6; margin: 0; padding: 12px;
      font-size: 12px;
    }
    h1 { font-size: 13px; margin: 0 0 10px; font-weight: 600; }
    .row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #7a7a7a; }
    .dot.on { background: #3ba55d; }
    .dot.off { background: #d24b4b; }
    #log {
      background: #1b1b1b; border: 1px solid #3a3a3a; border-radius: 3px;
      height: 300px; overflow-y: auto; padding: 8px;
      font-family: Consolas, monospace; font-size: 11px; white-space: pre-wrap;
    }
    .ok { color: #7fc98a; } .err { color: #e07a7a; } .dim { color: #8a8a8a; }
    button {
      background: #3a3a3a; color: #e6e6e6; border: 1px solid #555;
      border-radius: 3px; padding: 5px 10px; cursor: pointer; font-size: 12px;
    }
    button:hover { background: #4a4a4a; }
  </style>
</head>
<body>
  <h1>AutoCut — мост в Premiere</h1>
  <div class="row">
    <span class="dot" id="dot"></span>
    <span id="state">проверяю…</span>
  </div>
  <div class="row">
    <button id="btn-check">Проверить проект</button>
    <button id="btn-refresh">Обновить</button>
  </div>
  <div id="log"></div>
  <script src="panel.js"></script>
</body>
</html>
